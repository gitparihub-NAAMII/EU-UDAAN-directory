<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UDAAN commitments directory</title>
<meta name="description" content="What each UDAAN consortium partner committed to the EU, who owns it, and progress.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="modulepreload" href="assets/data.js">
<link rel="modulepreload" href="assets/backend.js">
<script src="config.js"></script>
<script type="module" src="assets/app.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="iconbtn menu-btn" id="menuBtn" aria-label="Open directory">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/">UDAAN directory</a>
    <form class="searchbox" id="searchForm" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Search the directory</label>
      <input id="q" type="search" placeholder="Find a commitment, partner, role, target…" autocomplete="off">
    </form>
    <button class="switch" id="trackSwitch" role="switch" aria-checked="false" hidden>
      <span class="knob" aria-hidden="true"></span><span class="long">Connect with Project Tracking System</span><span class="short">Tracking</span>
    </button>
    <button class="iconbtn authbtn" id="authBtn" hidden></button>
    <button class="iconbtn askbtn" id="askTop" aria-label="Ask the register">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span>Ask</span>
    </button>
  </div>
  <div class="layout">
    <aside class="side" id="side" aria-label="Directory"><nav class="nav" id="nav"></nav></aside>
    <main class="main" id="main"><p class="lede">Loading the directory…</p></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<button class="fab" id="fab" aria-label="Ask the register">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Ask
</button>
<aside class="chat" id="chat" aria-label="Ask the register">
  <header><strong>Ask the register</strong>
    <button class="iconbtn" id="clearChat" title="Start a new conversation">New</button>
    <button class="iconbtn" id="closeChat" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="ctx" id="chatCtx"></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="composer">
    <label class="sr" for="chatIn">Your question</label>
    <textarea id="chatIn" rows="1" placeholder="e.g. Has NAAMII committed to animation?"></textarea>
    <button class="btn primary" id="chatSend">Ask</button>
  </div>
</aside>

<dialog class="signin" id="signin">
  <h2>Sign in</h2>
  <div class="small">Team members only. Ask the directory admin for an account.</div>
  <form id="signinForm">
    <label>Email <input type="email" id="siEmail" autocomplete="username" required></label>
    <label>Password <input type="password" id="siPass" autocomplete="current-password" required></label>
    <span class="err" id="siErr"></span>
    <div class="acts"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="siCancel">Cancel</button></div>
  </form>
</dialog>

<noscript><p style="padding:20px">This directory needs JavaScript turned on.</p></noscript>
</body>
</html>
